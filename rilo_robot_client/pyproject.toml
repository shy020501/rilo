[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rilo-robot-client"
version = "0.1.0"
description = "Independent robot PC transport and execution bridge for RILO"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "httpx>=0.27,<1", "pillow>=10,<13"]

[project.scripts]
rilo-robot-client = "rilo_robot_client.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rilo_robot_client*"]
